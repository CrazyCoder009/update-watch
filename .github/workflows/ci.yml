name: ci
on: [push, pull_request]

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.8", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest -v
      - run: bash -n install.sh get.sh tests/containers.sh

  distros:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ["archlinux:latest", "debian:stable", "ubuntu:24.04", "fedora:latest"]
    steps:
      - uses: actions/checkout@v4
      - run: tests/containers.sh ${{ matrix.image }}
